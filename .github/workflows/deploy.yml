name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Game #1 (powder-and-pickaxe)
        working-directory: ./powder-and-pickaxe
        run: |
          npm install
          npm run build

      - name: Assemble Static Site (_site)
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -r powder-and-pickaxe/dist _site/powder-and-pickaxe

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages (Actions Source)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages branch (Branch Source Fallback)
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
